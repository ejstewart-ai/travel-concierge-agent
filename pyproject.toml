[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-concierge-agent"
version = "0.1.0"
description = "Multi-agent Travel Concierge built with Google ADK featuring AgentOps guardrails, compaction, persistent memory, HITL approvals, OpenTelemetry tracing, PII redaction, and Terraform IaC."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-secret-manager>=2.21.0",
    "google-cloud-dlp>=3.25.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "asyncpg>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
travel-concierge = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.agents-cli]
agent_directory = "app"
deployment_target = "cloud_run"
region = "us-central1"
